[workspace]
resolver = "2"
members = ["crates/flight-core", "crates/flight-protocol", "crates/flight-config", "apps/replay", "apps/esp32", "apps/proxy", "adapters/gazebo"]
default-members = ["crates/flight-core", "crates/flight-protocol", "crates/flight-config", "apps/replay", "apps/esp32", "apps/proxy", "adapters/gazebo"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
flight-core = { path = "crates/flight-core" }
flight-protocol = { path = "crates/flight-protocol" }
flight-config = { path = "crates/flight-config" }
libm = "=0.2.16"
sha2 = { version = "=0.10.9", default-features = false }
# Host-only test dependency; never linked into firmware.
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }

# Every unsafe operation states its safety argument (AGENTS.md: audited boundaries).
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

