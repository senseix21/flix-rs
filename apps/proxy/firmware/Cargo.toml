[package]
name = "flix-proxy-firmware"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "Apache-2.0"
[workspace]
# Same unsafe policy as the root workspace; this is a separate SDK-linked workspace.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
[lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
[lib]
crate-type = ["staticlib"]
[dependencies]
flight-proxy = {path = ".."}
[profile.release]
panic = "abort"
lto = true
codegen-units = 1
[profile.dev]
panic = "abort"
