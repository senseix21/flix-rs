name: Host contracts
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: flix-rust
      - uses: actions/checkout@v4
        with:
          repository: okalachev/flix
          ref: 1f5b268271536e45a9377d1c5317d3eb6f3c3bba
          path: flix
      - name: Toolchain
        working-directory: flix-rust
        run: rustup toolchain install 1.92.0 --component rustfmt --component clippy --target thumbv7em-none-eabihf
      - name: Consolidated host gates
        working-directory: flix-rust
        run: sh scripts/check.sh
      - name: Allocation-free embedded dependency check
        working-directory: flix-rust
        run: |
          cargo check --manifest-path apps/esp32/firmware/Cargo.toml --locked --release --target thumbv7em-none-eabihf
          cargo check --manifest-path apps/proxy/firmware/Cargo.toml --locked --release --target thumbv7em-none-eabihf

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Advisories, licences, bans and sources
        run: sh scripts/deny.sh

  kani:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Kani 0.68.0
        run: |
          cargo install --locked kani-verifier --version 0.68.0
          cargo kani setup
      - name: Model-check flight-core proofs
        working-directory: crates/flight-core
        run: cargo kani -Z stubbing

  gazebo:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: flix-rust
      - uses: actions/checkout@v4
        with:
          repository: okalachev/flix
          ref: 1f5b268271536e45a9377d1c5317d3eb6f3c3bba
          path: flix
      - name: Build and exercise actual Gazebo plugin
        working-directory: flix-rust
        run: make sim-check
      - name: Finite traced physics probes
        working-directory: flix-rust
        run: make sim-scenarios
      - name: Paired C++/Rust plant comparison
        working-directory: flix-rust
        run: make sim-parity
      - name: Three-drone swarm flight in Gazebo
        working-directory: flix-rust
        run: make swarm-gazebo-check
      - name: Preserve simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-probes
          path: flix-rust/.local/qualification/

  swarm:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: flix-rust
      - name: Crazyswarm2 coordinating simulated Flix drones
        working-directory: flix-rust
        run: make swarm-sim
      - name: Preserve swarm evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swarm
          path: |
            flix-rust/.local/qualification/swarm-s1/
            flix-rust/.local/qualification/swarm-s2/

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Nightly toolchain and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz every untrusted-input target
        run: sh scripts/fuzz.sh 120
      - name: Preserve crash reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
